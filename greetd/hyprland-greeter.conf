# /etc/greetd/hyprland-greeter.conf
# Hyprland minimo, so para hospedar o ReGreet no login (rodado pelo usuario 'greeter').

# --- MONITORES: espelha tudo no laptop (mesma imagem nos dois, SEM split) ---
monitor = eDP-1, preferred, 0x0, 1
monitor = HDMI-A-1, preferred, 0x0, 1, mirror, eDP-1
# qualquer outro monitor tambem espelha o laptop
monitor = , preferred, 0x0, 1, mirror, eDP-1

# Sobe o greeter; quando ele fecha (apos o login), encerra este Hyprland para o
# greetd seguir com a sessao escolhida pelo usuario.
exec-once = regreet; hyprctl dispatch exit

# Mesmo layout de teclado da sua sessao (digitar a senha igual).
input {
    kb_layout = us
    kb_variant = intl
}

# Cursor escuro/coerente.
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

# Minimalista: sem gaps, sem borda, sem logo, sem animacoes, sem blur/sombra.
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}
decoration {
    rounding = 0
    blur { enabled = false }
    shadow { enabled = false }
}
animations { enabled = false }
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# Saida de emergencia, se precisar abandonar o greeter.
bind = SUPER, Q, exit
