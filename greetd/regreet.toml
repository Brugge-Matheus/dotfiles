# /etc/greetd/regreet.toml — greeter grafico do greetd.
# Mostra selecao de usuario + selecao de sessao. Os botoes de desligar/reiniciar
# aparecem por causa da secao [commands].

[background]
# Copiado para um caminho lido pelo usuario 'greetd' (o ~/ do seu user e 700).
path = "/usr/share/backgrounds/regreet-bg.jpg"
fit = "Cover"

[commands]
reboot   = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]

[GTK]
# Visual escuro pra casar com o resto do sistema (mesmos temas do seu usuario).
application_prefer_dark_theme = true
theme_name = "Adwaita-dark"
icon_theme_name = "Papirus-Dark"
cursor_theme_name = "Adwaita"
font_name = "JetBrainsMono Nerd Font 12"
