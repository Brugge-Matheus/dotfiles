# hyprlock — lockscreen (tema Tokyo Night)
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = false       # cursor visivel p/ clicar nos botoes de power
    immediate_render = true   # renderiza ja no inicio (evita perder as primeiras teclas)
    ignore_empty_input = true # Enter com campo vazio nao dispara "senha incorreta"
    # grace: nesta versao NAO existe como opcao de config; e passado via CLI
    #        (--grace 0) no lock.sh -> exige senha imediatamente (tela de login).
    # disable_loading_bar: removido nesta versao (nao existe mais).
}

background {
    monitor =
    color = rgba(16161eff)
    blur_passes = 0
}

# Relógio
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(c0caf5ff)
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 150
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=pt_BR.UTF-8 date +'%A, %d de %B')"
    color = rgba(565f89ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

# Avatar / usuário
label {
    monitor =
    text =   $USER
    color = rgba(7aa2f7ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

# Campo de senha
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(292e42ff)
    inner_color = rgba(1a1b26ff)
    font_color = rgba(c0caf5ff)
    check_color = rgba(9ece6aff)
    fail_color = rgba(f7768eff)
    fail_text = <i>Senha incorreta</i>
    placeholder_text = <i>Digite a senha...</i>
    rounding = 12
    position = 0, -80
    halign = center
    valign = center
}

# --- Botoes de power (canto inferior, minimalistas) -------------------
# Glyphs Material Design (nf-md-*). Recorte: o hyprlock dimensiona a textura do
# label pela LARGURA DE AVANCO; glyphs redondos tem a tinta uns px mais larga
# que o avanco -> a direita era cortada ("preso num max-width"). O espaco COMUM
# a direita era removido pelo trim do parser (so sobrava a pontinha cortada).
# CORRECAO: NBSP (U+00A0) de cada lado -> tem avanco (alarga a textura) e NAO e
# trimado (nao e whitespace ASCII). halign=center mantem o icone no meio.

# Suspender
label {
    monitor =
    text =   󰤄  
    onclick = systemctl suspend
    color = rgba(565f89ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -70, 55
    halign = center
    valign = bottom
}

# Reiniciar
label {
    monitor =
    text =   󰜉  
    onclick = systemctl reboot
    color = rgba(565f89ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 55
    halign = center
    valign = bottom
}

# Desligar
label {
    monitor =
    text =   󰐥  
    onclick = systemctl poweroff
    color = rgba(565f89ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 70, 55
    halign = center
    valign = bottom
}
