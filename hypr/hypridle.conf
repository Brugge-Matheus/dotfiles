# hypridle — gerenciamento de inatividade
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock          # evita locks duplicados
    before_sleep_cmd = loginctl lock-session        # trava ANTES de suspender (pede senha ao acordar)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'   # liga a tela ao acordar
}

# 2,5 min: diminui o brilho (salvando o valor atual)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 min: bloqueia a tela
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min: desliga a tela (DPMS)
# Nota: nesta versao do Hyprland (config Lua), "hyprctl dispatch dpms off" NAO
# funciona (e interpretado como Lua). A forma correta via CLI e hl.dsp.dpms(...).
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}
