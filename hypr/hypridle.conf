# hypridle — gerenciamento de inatividade
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock          # evita locks duplicados
    before_sleep_cmd = loginctl lock-session        # trava antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on      # liga a tela ao acordar
}

# 2,5 min: diminui o brilho (salvando o valor atual)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 min: bloqueia a tela
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min: desliga a tela (DPMS)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
