# hypridle — gerenciamento de inatividade
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh       # guard resiliente (relanca se morrer; ja evita duplicar)
    # Trava ANTES de suspender (pede senha ao acordar). O `sleep 1` NAO e frescura:
    # loginctl lock-session RETORNA na hora (so emite o sinal de lock), entao sem
    # a pausa o sistema suspende PEGANDO o hyprlock no meio da inicializacao — os
    # comandos do widget "tocando agora" ficam pendentes e ao acordar o hyprlock
    # os trata como pendentes e para de atualizar (widget congela; hyprlock #499).
    # O sleep segura o delay-lock de suspensao ~1s p/ o hyprlock subir por inteiro.
    before_sleep_cmd = loginctl lock-session && sleep 1
    # Ao acordar: APENAS liga a tela. NUNCA matar o hyprlock aqui.
    # HISTORICO (pegadinha que custou caro): eu matava o hyprlock no resume
    # (`pkill -x hyprlock`) p/ destravar os timers dos labels cmd[update]
    # (relogio/widget). MAS matar o lock client faz o Hyprland entrar no estado
    # "lockscreen crashou" e mostrar a tela "Oopsie daisy... the lockscreen app
    # died" (bloqueia o acesso; so sai com `hl.clear_crashed_lockscreen()` noutro
    # tty). ERA ESSE o "crash apos suspender" que o usuario via — NAO o compositor.
    # O freeze do relogio ja e coberto pelo hyprlock 0.9.6 (PR #655) + a capa
    # nao-bloqueante do now-playing ([[arch-hyprlock-now-playing]]); nao precisa
    # matar nada. Se algum label congelar, o 1o movimento do mouse ja religa.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 2,5 min: diminui o brilho (salvando o valor atual)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 min: bloqueia a tela
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# DPMS off: REMOVIDO de proposito.
# O hyprlock NAO lida com o display ficando indisponivel (issue oficial
# hyprwm/hyprlock#953): se o DPMS apaga a tela ENQUANTO o hyprlock esta na
# frente (lock aos 5min, dpms aos 6min), a tela nao volta mais. A recomendacao
# robusta e nao fazer dpms off com a sessao travada. Economia de bateria fica
# por conta do dim (acima) + suspender. Se quiser tela 100% apagada no idle,
# o caminho robusto e suspender (systemctl suspend), nao dpms off.
