# hypridle — gerenciamento de inatividade
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh       # guard resiliente (relanca se morrer; ja evita duplicar)
    before_sleep_cmd = loginctl lock-session        # trava ANTES de suspender (pede senha ao acordar)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'   # liga a tela ao acordar
}

# 2,5 min: diminui o brilho (salvando o valor atual)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 min: bloqueia a tela
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# DPMS off: REMOVIDO de proposito.
# O hyprlock NAO lida com o display ficando indisponivel (issue oficial
# hyprwm/hyprlock#953): se o DPMS apaga a tela ENQUANTO o hyprlock esta na
# frente (lock aos 5min, dpms aos 6min), a tela nao volta mais. A recomendacao
# robusta e nao fazer dpms off com a sessao travada. Economia de bateria fica
# por conta do dim (acima) + suspender. Se quiser tela 100% apagada no idle,
# o caminho robusto e suspender (systemctl suspend), nao dpms off.
