# =====================================================================
#  input.conf — atalhos extras do mpv (somam aos padrões)
#  Symlinkado p/ ~/.config/mpv/input.conf pelo arch/install.sh
#  Lista completa dos padrões: https://mpv.io/manual/stable/#keyboard-control
# =====================================================================

# --- Velocidade de reprodução ---
[            multiply speed 1/1.1     # desacelera
]            multiply speed 1.1       # acelera
BS           set speed 1.0           # volta ao normal (Backspace)

# --- Navegação fina ---
RIGHT        seek  5
LEFT         seek -5
UP           seek  60
DOWN         seek -60
Shift+RIGHT  frame-step              # avança 1 quadro
Shift+LEFT   frame-back-step         # volta 1 quadro

# --- Legendas ---
z            add sub-delay -0.1      # legenda adianta
x            add sub-delay  0.1      # legenda atrasa
v            cycle sub-visibility    # liga/desliga legenda
j            cycle sub               # próxima faixa de legenda
J            cycle sub down          # faixa anterior

# --- Áudio ---
Shift+z      add audio-delay -0.1    # sincroniza áudio
Shift+x      add audio-delay  0.1
a            cycle audio             # troca faixa de áudio

# --- Tela / captura ---
f            cycle fullscreen
s            screenshot              # print COM legenda/OSD (na ~/Pictures)
S            screenshot video        # print do frame LIMPO (sem legenda/OSD)
i            script-binding stats/display-stats-toggle   # infos (bitrate, hwdec…)

# --- Loop e corte ---
l            ab-loop                 # marca A -> B p/ repetir um trecho
L            cycle-values loop-file "inf" "no"   # repete o arquivo todo
