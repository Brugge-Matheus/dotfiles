# =====================================================================
#  mpv.conf — player principal (minimalista, aceleração por hardware)
#  Symlinkado p/ ~/.config/mpv/mpv.conf pelo arch/install.sh
#
#  Foco: decodificar em HW pela iGPU Intel (VA-API/iHD, já configurada no
#  01-foundation.sh) -> vídeo suave, CPU/bateria aliviados. Estética ayu/black.
# =====================================================================

# ---- Saída de vídeo / decodificação por hardware --------------------
vo=gpu-next            # saída moderna (libplacebo); melhor qualidade de imagem
                       #   (se der problema em algum vídeo, troque p/ vo=gpu)
hwdec=auto-safe        # usa VA-API no Intel (iHD); "safe" evita caminhos quebrados
profile=gpu-hq         # scalers melhores (dithering/deband) sem pesar no iGPU

# ---- Qualidade de imagem (leve, ok p/ notebook) ---------------------
scale=spline36         # upscale nítido e barato
dscale=mitchell        # downscale suave (menos aliasing em 4K->1080p)
deband=yes             # remove "banding" em gradientes (céu, sombras)

# ---- Comportamento --------------------------------------------------
keep-open=yes          # não fecha ao acabar o vídeo (mostra o último frame)
save-position-on-quit=yes   # retoma de onde parou ao reabrir o mesmo arquivo
force-seekable=yes
cursor-autohide=1000   # some o cursor após 1s parado

# ---- Áudio ----------------------------------------------------------
volume=100
volume-max=150         # permite passar de 100% quando o vídeo é baixo
audio-file-auto=fuzzy  # carrega faixas de áudio externas automaticamente

# ---- Legendas -------------------------------------------------------
sub-auto=fuzzy               # acha legendas com nome parecido
slang=pt-BR,pt,por,en,eng    # ordem de preferência de idioma
alang=pt-BR,pt,por,en,eng,ja
sub-font=JetBrainsMono Nerd Font
sub-font-size=42
sub-color=#FFBFBDB6          # texto ayu-fg
sub-border-color=#FF0B0E14   # contorno ayu-bg (legível em qualquer fundo)
sub-border-size=2.5
sub-shadow-offset=1
sub-shadow-color=#80000000

# ---- OSD / mensagens na tela (paleta ayu) ---------------------------
osd-font=JetBrainsMono Nerd Font
osd-font-size=32
osd-color=#FFBFBDB6          # ayu-fg
osd-border-color=#FF0B0E14   # ayu-bg
osd-border-size=2
osd-bar-align-y=0.9
osd-bar-h=2                  # barra de progresso fininha
osd-bar-w=90

# ---- YouTube / links (yt-dlp) ---------------------------------------
# Toca URLs direto: `mpv <link>`. Limita a 1440p p/ não engasgar (o iGPU
# decodifica VP9/AV1 em HW; acima disso raramente compensa).
ytdl-format=bestvideo[height<=?1440]+bestaudio/best
