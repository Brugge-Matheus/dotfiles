# fuzzel — config dedicada do power menu (menu pequeno abaixo do botao)
[main]
font=JetBrainsMono Nerd Font:size=11
prompt=""
icons-enabled=no
anchor=top-right
x-margin=8
y-margin=6
lines=5
width=14
horizontal-pad=16
vertical-pad=10
inner-pad=10
line-height=22
tabs=2

[colors]
background=0a0a0af2
text=d4d4d4ff
match=ffffffff
selection=1c1c1cff
selection-text=ffffffff
selection-match=e06c75ff
border=1c1c1cff

[border]
width=1
radius=12
