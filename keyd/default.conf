# /etc/keyd/default.conf
# Remapeia no nivel do evdev (abaixo do compositor), valendo para TODOS os apps
# (navegador, GTK4, Qt, Electron, terminal, TTY...).

[ids]
*

[alt]
# Alt+Backspace passa a emitir Ctrl+Backspace = "apagar palavra anterior",
# que e o padrao de fato no Linux grafico (GTK/Qt/navegadores).
backspace = C-backspace
