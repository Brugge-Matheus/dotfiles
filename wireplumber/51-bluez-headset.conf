## Bluetooth de alta qualidade (WirePlumber 0.5+)
##  Problema que isto resolve: headset (ex.: MCHOSE V9 PRO) as vezes conecta
##  expondo SO os perfis HFP (voz, mono, "abafado") e o A2DP (musica, estereo)
##  nao aparece -> som ruim + autoswitch caindo em "off". Aqui forcamos os
##  codecs bons e deixamos o A2DP como preferido.
##
##  HFP = perfil de MICROFONE/ligacao. Tem DOIS codecs: CVSD (8kHz, "abafado")
##  e mSBC (16kHz wideband, MUITO melhor — e o que o Windows usa). O `bluez5.codecs`
##  abaixo e um WHITELIST: se `msbc` nao estiver na lista, o WirePlumber NAO oferece
##  mSBC e cai no CVSD (abafado) — era exatamente o bug (Windows bom, Linux abafado).
##  Por isso `msbc` (e `cvsd` como fallback) ESTAO na lista. Adaptador Intel AX201
##  + o fone suportam mSBC. O autoswitch (default) troca pro HFP quando um app abre
##  o mic e VOLTA pro A2DP ao terminar — igual Windows. Nao desligamos de proposito.
##
##  Se mesmo assim conectar "abafado": reconecte o fone
##  (bluetoothctl disconnect/connect, ou desliga/liga o fone). Isso re-sonda o
##  A2DP. Ver ~/dotfiles/arch/README.md (secao Audio Bluetooth).

monitor.bluez.properties = {
  # Codecs A2DP de alta qualidade (ordem = preferencia): AAC > SBC-XQ > SBC
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc   = true
  bluez5.enable-hw-volume = true
  bluez5.codecs = [ aac sbc_xq sbc msbc cvsd ]

  # Papeis: A2DP (musica) + HFP (mic). Sem BAP/LE-audio (o fone e classico BR/EDR).
  bluez5.roles = [ a2dp_sink a2dp_source hfp_hf hfp_ag ]
}
