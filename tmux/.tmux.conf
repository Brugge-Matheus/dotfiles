# Usa zsh nos panes (independe do $SHELL da sessao; portavel via PATH)
if-shell 'command -v zsh' 'set -g default-command zsh'

# Terminal & colors (works locally, in Docker, and over SSH)
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:Tc"
set -g allow-passthrough on

# Enable activity alerts
set -g monitor-activity on
set -g visual-bell off
set -g visual-activity off
set -g visual-silence off

# Increase history (buffer size)
set-option -g history-limit 30000
# Set vim keys for almost everything.
set-option -g mode-keys vi

set -g mouse on
set -g renumber-windows on # Reorder window numbers

# Start windows e panes from 1
set -g base-index 1
set -g pane-base-index 1

# Manter sessões vivas e salvar periodicamente
set -g detach-on-destroy off  # Não desacopla ao destruir pane final
set -g destroy-unattached off # Não destroi se ninguém está conectado

# Add title to the terminal
set -g set-titles on
set -g set-titles-string '\
{#H} #S:#W #{session_alerts}\
#(ps ax -o comm= -p "#{client_pid}" 2>/dev/null | \
grep -q sshd && printf " [SSH] ") \
#{?client_prefix,✼, }'

setw -g allow-rename off
setw -g automatic-rename off

# Enable clipboard integration
set -g set-clipboard on
set -g allow-passthrough on
bind -T copy-mode-vi v send -X begin-selection

# macOS: pbcopy
if-shell 'uname -s | grep -q Darwin' {
  bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
}

# Linux / Docker / SSH: OSC 52
if-shell 'uname -s | grep -q Linux' {
  bind -T copy-mode-vi y     send -X copy-pipe-and-cancel \
    "tmux save-buffer - | base64 | tr -d '\n' | printf '\033]52;c;%s\007' \"$(cat)\""
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel \
    "tmux save-buffer - | base64 | tr -d '\n' | printf '\033]52;c;%s\007' \"$(cat)\""
}

# <prefix> r (reload) - Reloads .tmux.conf
bind r run-shell -b '\
  tmux source-file ~/.tmux.conf ; \
  tmux display-message "Config reloaded 🌀..."; \
'

# <prefix> Ctrl+l - list all windows using fzf
bind C-l run-shell '${HOME}/.tmux/scripts/fzf.sh'

# Split de painéis (mantém o diretório atual)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navegação entre painéis com hjkl (estilo vim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Popup Keybinds
# <prefix> Ctrl+n (notes) - Opens nvim for notes
bind-key C-n display-popup -E -w 60% -h 60% "${HOME}/.tmux/scripts/make_note.sh"
# <prefix> Ctrl+h (htop) - Opens htop (q closes)
bind-key C-h display-popup -E -w 80% -h 80% "htop"
# <prefix> Ctrl+t (terminal) - Opens a new terminal popup (exit closes)
bind-key C-t display-popup -E -w80% -h80% ""
# <prefix> Ctrl+w (toggle popup) - floating terminal session
bind-key -r C-w run-shell '${HOME}/.tmux/scripts/popup.sh float_popup term'

# TPM (Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum - Restauração automática de sessões
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Start TPM
run '${HOME}/.tmux/plugins/tpm/tpm'

# ============================================================================
# THEME - DEVE VENIR APÓS TPM PARA NÃO INTERFERIR COM CONTINUUM
# ============================================================================

set -g status "on"
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#e7e7e6,bg=#0b0b0c"

# Messages
set -g message-style "fg=#d6a84a,bg=#0b0b0c"
set -g message-command-style "fg=#d6a84a,bg=#0b0b0c"
set -g mode-style "fg=#0b0b0c,bg=#d6a84a"

# Status left: session name
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=#0b0b0c bg=#eac884 bold]  ✼ #S  #[default],#[fg=#0b0b0c bg=#d6a84a bold]  󰆍 #S  #[default]}"

# Status right: deixar com hora para continuum adicionar seu comando
set -g status-right-length 80
set -g status-right "%d %b   %H:%M "

# Janela inativa
setw -g window-status-style "fg=#8a8a8f,bg=#0b0b0c"
setw -g window-status-format "  #I:#W  "

# Janela ativa
setw -g window-status-current-style "fg=#0b0b0c,bg=#d6a84a,bold"
setw -g window-status-current-format "#[fg=#d6a84a,bg=#0b0b0c]#[fg=#0b0b0c,bg=#d6a84a,bold]  #I:#W  #[fg=#d6a84a,bg=#0b0b0c]"

setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#eac884,bg=#0b0b0c"

# Bordas dos painéis
set -g pane-border-style "fg=#22222a"
set -g pane-active-border-style "fg=#d6a84a"

# --- Tema "Terminal Refinado" (ver arch/THEME.md): seletor de sessoes (prefix+w), menus, popups, etc. ---
# prefix+w / choose-tree: moldura e indicador do preview (antes cinza/vermelho padrao do tmux)
set -g tree-mode-border-style "fg=#30303a,bg=#0b0b0c"
set -g tree-mode-preview-style "fg=#d6a84a,bg=#0b0b0c"
set -g tree-mode-selection-style "fg=#0b0b0c,bg=#d6a84a"
# menus (clique direito/prefix+<) e popups (display-popup, fzf/popup.sh)
set -g menu-style "fg=#e7e7e6,bg=#101012"
set -g menu-selected-style "fg=#0b0b0c,bg=#d6a84a"
set -g menu-border-style "fg=#30303a,bg=#101012"
set -g popup-style "fg=#e7e7e6,bg=#0b0b0c"
set -g popup-border-style "fg=#30303a,bg=#0b0b0c"
# prefix+q (numeros dos paineis) e prefix+t (relogio)
set -g display-panes-colour "#8a8a8f"
set -g display-panes-active-colour "#d6a84a"
set -g display-panes-border-style "fg=#30303a,bg=#0b0b0c"
set -g clock-mode-colour "#d6a84a"
# modo de copia: busca, marca, numeros de linha, scrollbar de painel
set -g copy-mode-match-style "fg=#0b0b0c,bg=#8a6e31"
set -g copy-mode-current-match-style "fg=#0b0b0c,bg=#eac884"
set -g copy-mode-mark-style "fg=#0b0b0c,bg=#d6a84a"
set -g copy-mode-current-line-number-style "fg=#d6a84a"
set -g copy-mode-line-number-style "fg=#55555a"
set -g pane-scrollbars-style "fg=#30303a,bg=#0b0b0c"
set -g switch-mode-match-style "fg=#0b0b0c,bg=#d6a84a"
setw -g window-status-bell-style "fg=#0b0b0c,bg=#c87067"

# Deve ficar no final — run-shell evita que tmux expanda ~ como path
run-shell 'tmux unbind-key -T prefix "~" 2>/dev/null || true'
