# Terminal & colors (works locally, in Docker, and over SSH)
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:Tc"
set -g allow-passthrough on

# Enable activity alerts
set -g monitor-activity on
set -g visual-bell off
set -g visual-activity off
set -g visual-silence off

# Increase history (buffer size)
set-option -g history-limit 30000
# Set vim keys for almost everything.
set-option -g mode-keys vi

set -g mouse on
set -g renumber-windows on # Reorder window numbers

# Start windows e panes from 1
set -g base-index 1
set -g pane-base-index 1

# Add title to the terminal
set -g set-titles on
set -g set-titles-string '\
{#H} #S:#W #{session_alerts}\
#(ps ax -o comm= -p "#{client_pid}" 2>/dev/null | \
grep -q sshd && printf " [SSH] ") \
#{?client_prefix,✼, }'

setw -g allow-rename off
setw -g automatic-rename off

# Enable clipboard integration
set -g set-clipboard on
set -g allow-passthrough on
bind -T copy-mode-vi v send -X begin-selection

# macOS: pbcopy
if-shell 'uname -s | grep -q Darwin' {
  bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
}

# Linux / Docker / SSH: OSC 52
if-shell 'uname -s | grep -q Linux' {
  bind -T copy-mode-vi y     send -X copy-pipe-and-cancel \
    "tmux save-buffer - | base64 | tr -d '\n' | printf '\033]52;c;%s\007' \"$(cat)\""
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel \
    "tmux save-buffer - | base64 | tr -d '\n' | printf '\033]52;c;%s\007' \"$(cat)\""
}

# <prefix> r (reload) - Reloads .tmux.conf
bind r run-shell -b '\
  tmux source-file ~/.tmux.conf ; \
  tmux display-message "Config reloaded 🌀..."; \
'

# <prefix> Ctrl+l - list all windows using fzf
bind C-l run-shell '${HOME}/.tmux/scripts/fzf.sh'

# Navegação entre painéis com hjkl (estilo vim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Popup Keybinds
# <prefix> Ctrl+n (notes) - Opens nvim for notes
bind-key C-n display-popup -E -w 60% -h 60% "${HOME}/.tmux/scripts/make_note.sh"
# <prefix> Ctrl+h (htop) - Opens htop (q closes)
bind-key C-h display-popup -E -w 80% -h 80% "htop"
# <prefix> Ctrl+t (terminal) - Opens a new terminal popup (exit closes)
bind-key C-t display-popup -E -w80% -h80% ""
# <prefix> Ctrl+w (toggle popup) - floating terminal session
bind-key -r C-w run-shell '${HOME}/.tmux/scripts/popup.sh float_popup term'

# THEME
set -g status "on"
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=white,bg=#1e1e2e"

# Messages
set -g message-style "fg=cyan,bg=#1e1e2e"
set -g message-command-style "fg=cyan,bg=#1e1e2e"
set -g mode-style "fg=#1e1e2e,bg=cyan"

# Status left: session name
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=black bg=yellow bold]  ✼ #S  #[default],#[fg=black bg=cyan bold]  󰆍 #S  #[default]}"

# Status right: data e hora
set -g status-right-length 60
set -g status-right "#[fg=cyan,bg=#1e1e2e]#[fg=#1e1e2e,bg=cyan,bold]  %d %b   %H:%M "

# Janela inativa
setw -g window-status-style "fg=#6c7086,bg=#1e1e2e"
setw -g window-status-format "  #I:#W  "

# Janela ativa
setw -g window-status-current-style "fg=#1e1e2e,bg=cyan,bold"
setw -g window-status-current-format "#[fg=cyan,bg=#1e1e2e]#[fg=#1e1e2e,bg=cyan,bold]  #I:#W  #[fg=cyan,bg=#1e1e2e]"

setw -g window-status-separator ""
setw -g window-status-activity-style "fg=yellow,bg=#1e1e2e"

# Bordas dos painéis
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=cyan"

# TPM (Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum config
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Start TPM
run '${HOME}/.tmux/plugins/tpm/tpm'
